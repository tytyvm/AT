services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: awt, POSTGRES_PASSWORD: awt, POSTGRES_DB: awt }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  # Optional local open-weight models (used from phase 3 on). Start with:
  #   docker compose --profile models up
  ollama:
    image: ollama/ollama:latest
    profiles: ["models"]
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
volumes: { pgdata: {}, ollama: {} }
